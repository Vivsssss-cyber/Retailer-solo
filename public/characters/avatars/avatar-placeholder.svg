<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" role="img" aria-label="Pixel-art player avatar placeholder">
  <rect width="16" height="16" fill="#002C33"/>
  <!-- hair fringe -->
  <rect x="4" y="2" width="8" height="2" fill="#003C49"/>
  <!-- face -->
  <rect x="5" y="4" width="6" height="5" fill="#F0D9C0"/>
  <!-- eyes -->
  <rect x="6" y="5" width="1" height="1" fill="#002C33"/>
  <rect x="9" y="5" width="1" height="1" fill="#002C33"/>
  <rect x="6" y="5" width="1" height="1" fill="#00D2FF" opacity="0.35"/>
  <!-- mouth -->
  <rect x="7" y="7" width="2" height="1" fill="#003C49"/>
  <!-- neck -->
  <rect x="7" y="9" width="2" height="1" fill="#F0D9C0"/>
  <!-- shoulders -->
  <rect x="3" y="10" width="10" height="6" fill="#006E85"/>
  <!-- collar accent -->
  <rect x="6" y="10" width="4" height="1" fill="#00C1EB"/>
  <rect x="7" y="11" width="2" height="1" fill="#003C49"/>
</svg>
